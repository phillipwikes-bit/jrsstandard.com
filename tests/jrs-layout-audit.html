<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>JRS local viewport audit</title></head>
<body><h1>JRS structural rendering audit (local source)</h1><pre id="results">Pending</pre>
<script>
(async function(){
 const checks=[
  {page:'index.html',width:390,selector:'.jr-action-main',maxTop:740},
  {page:'resources.html',width:390,selector:'.jrs-resource-primary-actions a',maxTop:660},
  {page:'jrsstandard.html',width:390,selector:'.core-principle-text',maxTop:1050},
  {page:'training.html',width:390,selector:'.hero-ctas a',maxTop:790},
  {page:'training.html',width:390,selector:'#training-modules h2',maxTop:990},
  {page:'index.html',width:320,selector:'.jr-action-main',maxTop:890},
  {page:'resources.html',width:320,selector:'.jrs-resource-primary-actions a',maxTop:780},
  {page:'jrsstandard.html',width:1440,selector:'.page-title',maxTop:560},
  {page:'training.html',width:1440,selector:'.hero-ctas a',maxTop:580},
  {page:'investigator-guides.html',width:390,selector:'main h1',maxTop:720},
  {page:'research.html',width:390,selector:'main h1',maxTop:720},
  {page:'reference/index.html',width:390,selector:'main h1',maxTop:720},
  {page:'check.html',width:390,selector:'main h1',maxTop:720},
  {page:'simulations.html',width:390,selector:'main h1',maxTop:720},
  {page:'codebook.html',width:390,selector:'main h1',maxTop:720},
  {page:'research-summary.html',width:390,selector:'main h1',maxTop:720},
  {page:'reviewer/index.html',width:390,selector:'main h1',maxTop:720},
  {page:'investigator-guides.html',width:390,selector:'.jrs-guide-quick-actions a',maxTop:610},
  {page:'research.html',width:390,selector:'.jrs-research-primary-links a',maxTop:760},
  {page:'codebook.html',width:390,selector:'.jrs-codebook-quick a',maxTop:690}
 ];
 const records=[];
 for(const item of checks){
  const f=document.createElement('iframe');
  f.width=item.width;
  f.height=1100;
  f.style.cssText='width:'+item.width+'px;height:1100px;border:0;display:block';
  f.title=item.page+' '+item.width;
  const loaded=new Promise((resolve,reject)=>{
   f.addEventListener('load',resolve,{once:true});
   f.addEventListener('error',()=>reject(Error('load failed')),{once:true});
  });
  // Navigate before inserting the frame so its first load event is for the target.
  f.src='/'+item.page;
  document.body.appendChild(f);
  try{
   await loaded;
   // A load event is not a stable render boundary. Wait for the page action
   // and deferred shared menu before measuring either geometry or accessibility.
   for(let attempts=0;attempts<24;attempts++){
     if(f.contentDocument?.querySelector(item.selector) &&
        f.contentDocument?.querySelector('.jrs-global-nav-toggle'))break;
     await new Promise(resolve=>setTimeout(resolve,90));
   }
   await new Promise(resolve=>setTimeout(resolve,100));
   const d=f.contentDocument,w=f.contentWindow;
   const action=d.querySelector(item.selector);
   const nav=d.querySelector('nav.jrs-sitenav');
   const toggle=d.querySelector('.jrs-global-nav-toggle');
   const narrow=item.width<=760;
   const before=nav? w.getComputedStyle(nav).display:null;
   const buttonDisplay=toggle? w.getComputedStyle(toggle).display:null;
   let opened=false,closed=false;
   if(narrow && toggle && nav){
    toggle.click();
    opened=toggle.getAttribute('aria-expanded')==='true' && w.getComputedStyle(nav).display!=='none';
    toggle.click();
    closed=toggle.getAttribute('aria-expanded')==='false' && w.getComputedStyle(nav).display==='none';
   }
   const top=action? Math.round(action.getBoundingClientRect().top):null;
   const scrollWidth=d.documentElement.scrollWidth;
   const vw=w.innerWidth;
   const title=d.title;
   const controlsValid=!!toggle && toggle.getAttribute('aria-controls')===nav?.id;
   let escapeClosed=true;
   if(narrow && toggle && nav){
     toggle.click();
     d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
     escapeClosed=toggle.getAttribute('aria-expanded')==='false' &&
       w.getComputedStyle(nav).display==='none' && d.activeElement===toggle;
   }
   // No horizontal overflow tolerance: one pixel is a failure, not a rounding allowance.
   const overflowElements=scrollWidth>vw ? [...d.body.querySelectorAll('*')]
     .filter(e=>{const rect=e.getBoundingClientRect();return rect.width>0 && rect.right>vw+0.5;})
     .slice(0,8).map(e=>({element:e.tagName.toLowerCase(),
       selector:e.id?'#'+e.id:(e.className&&typeof e.className==='string'?'.'+e.className.trim().split(/\\s+/).slice(0,2).join('.'):e.tagName.toLowerCase()),
       right:Math.round(e.getBoundingClientRect().right)})) : [];
   // Verify that the secondary Standard document index is actually functional,
   // closed initially at both viewport sizes, and closes after selecting a section.
   let documentIndexValid=true;
   if(item.page==='jrsstandard.html'){
     const sectionToggle=d.getElementById('nav-hamburger');
     const sectionMenu=d.getElementById('primary-nav-items');
     const selectConditions=sectionMenu?.querySelector('button[onclick="showSection(\'doccond\')"]');
     documentIndexValid=!!sectionToggle && !!sectionMenu && !!selectConditions &&
       sectionToggle.getAttribute('aria-controls')==='primary-nav-items' &&
       w.getComputedStyle(sectionMenu).display==='none';
     if(documentIndexValid){
       sectionToggle.click();
       documentIndexValid=sectionToggle.getAttribute('aria-expanded')==='true' &&
         w.getComputedStyle(sectionMenu).display!=='none';
       selectConditions.click();
       documentIndexValid=documentIndexValid &&
         sectionToggle.getAttribute('aria-expanded')==='false' &&
         w.getComputedStyle(sectionMenu).display==='none' &&
         !!d.querySelector('#section-doccond.page-section.active');
     }
   }
   // The mobile simulation choices must remain usable after being stacked.
   let simulationControlsValid=true;
   if(item.page==='training.html' && narrow){
     const second=d.getElementById('sim-tab-1');
     const first=d.getElementById('sim-tab-0');
     simulationControlsValid=!!second && !!first && !!w.showSimTab;
     if(simulationControlsValid){
       second.click();
       simulationControlsValid=second.getAttribute('aria-pressed')==='true' &&
         first.getAttribute('aria-pressed')==='false' &&
         w.getComputedStyle(d.getElementById('sim-panel-1')).display!=='none';
       first.click();
       simulationControlsValid=simulationControlsValid && first.getAttribute('aria-pressed')==='true';
     }
   }
   // Measured visual contrast and publication-metadata readability.
   // A current-page link must not regress to pale gold on a light background.
   const colorRGB=value=>{const m=value.match(/rgba?\(([^)]+)\)/);
     return m?m[1].split(',').slice(0,3).map(Number):null;};
   const relativeLuminance=rgb=>rgb.map(v=>v/255)
     .map(v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4))
     .reduce((sum,v,i)=>sum+v*[.2126,.7152,.0722][i],0);
   const wcagContrast=(fg,bg)=>{
     const a=colorRGB(fg),b=colorRGB(bg);
     if(!a||!b)return 0;
     const A=relativeLuminance(a),B=relativeLuminance(b);
     return (Math.max(A,B)+0.05)/(Math.min(A,B)+0.05);
   };
   const activeLink=d.querySelector('nav.jrs-sitenav a[aria-current="page"]');
   const activeContrast=activeLink?wcagContrast(w.getComputedStyle(activeLink).color,
     w.getComputedStyle(activeLink).backgroundColor):null;
   const contrastValid=item.page==='jrsstandard.html' ?
     activeContrast!==null && activeContrast>=4.5 : activeContrast===null || activeContrast>=4.5;
   const meta=d.querySelector('.meta-line');
   const metaFontSize=meta?Number.parseFloat(w.getComputedStyle(meta).fontSize):null;
   const metadataValid=!meta || metaFontSize>=12;
   const ok=!!action && top>=0 && top<=item.maxTop && scrollWidth<=vw &&
      controlsValid && documentIndexValid && simulationControlsValid && contrastValid && metadataValid && (narrow? (buttonDisplay!=='none' && before==='none' && opened && closed && escapeClosed): buttonDisplay==='none');
   records.push({page:item.page,width:item.width,top,limit:item.maxTop,scrollWidth,viewport:vw,
     menuPresent:!!toggle,menuInitially:before,menuOpened:opened,menuClosed:closed,
     escapeClosed,controlsValid,documentIndexValid,simulationControlsValid,activeContrast,contrastValid,metaFontSize,metadataValid,overflowElements,
     menuButtonDisplay:buttonDisplay,title,pass:ok});
  }catch(e){records.push({page:item.page,width:item.width,pass:false,error:String(e)});}
  f.remove();
 }
 const marker='JRS_'+'AUDIT_JSON_';
 document.getElementById('results').textContent=marker+'BEGIN'+JSON.stringify(records)+marker+'END';
 document.body.setAttribute('data-audit-complete','true');
})();
</script>
</body></html>
