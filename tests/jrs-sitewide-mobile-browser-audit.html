<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>JRS Sitewide Mobile Presentation Audit</title></head>
<body>
<h1>Source-rendered public page mobile presentation audit</h1>
<p>This verifies basic computed presentation and no horizontal overflow; it does not certify WCAG, VoiceOver, PDFs, conversion, or end-to-end form submissions.</p>
<pre id="jrs-sitewide-results">Running checks</pre>
<script>
(async function(){
  const paths=["index.html","resources.html","research.html","investigator-guides.html","manifest.html","about.html","contact.html","jrsstandard.html","training.html","check.html","simulations.html","decision-reconstruction-risk.html","research-summary.html","methodology.html","evidence-ledger.html","questions.html","research-register.html","privacy.html","terms.html","codebook.html","implementation-scenarios.html","operational-boundaries.html","reference/index.html","reference/ai-assisted-record-failure-modes/index.html","reference/ai-verification-controls/index.html","reference/decision-context-loss/index.html","reference/deployment-models/index.html","reference/documentation-risk-tiers/index.html","reference/escalation-triggers/index.html","reference/field-conditions/index.html","reference/implementation-maturity-levels/index.html","reference/later-review-failure-cascades/index.html","reference/missing-chronology/index.html","reference/record-survivability/index.html","reference/reviewer-responsibility-boundaries/index.html","reference/reviewer-worksheet/index.html","reference/second-line-review-model/index.html","reference/traveler-test/index.html","reference/unsupported-generalization/index.html","reviewer/index.html","ai-governance-record.html","compliance.html","datasets.html","finding.html","results.html","why-good-decisions-fail.html","privacy-notice.html","access.html","reviewer/evaluation.html","reviewer/completion.html","recheck.html","security.html","review-engine.html","coauthor.html","honor.html","ai-records-arm-b.html","404.html","people.html"];
  const widths=[320,390,768,1440];
  const jobs=paths.flatMap(path=>widths.map(width=>({path,width})));
  const records=new Array(jobs.length);
  function isVisible(w,el){
    if(!el || !el.isConnected || !el.getClientRects().length)return false;
    const style=w.getComputedStyle(el);
    return style.display!=='none' && style.visibility!=='hidden';
  }
  function check(item,idx){
    return new Promise(resolve=>{
      const f=document.createElement('iframe');
      f.title='Responsive audit '+item.path+' '+item.width;
      f.style.cssText='position:fixed;left:-200vw;top:0;width:'+item.width+'px;height:860px;border:0;';
      f.width=item.width;f.height=860;
      let resolved=false;
      function finish(row){if(resolved)return;resolved=true;records[idx]=row;f.remove();resolve();}
      f.addEventListener('error',()=>finish({...item,pass:false,error:'Frame failed to load'}),{once:true});
      f.addEventListener('load',()=>{
        (async()=>{
          try{
            // Give the progressively-enhanced mobile nav and styles a stable render boundary.
            await new Promise(r=>setTimeout(r,160));
            const d=f.contentDocument,w=f.contentWindow;
            if(!d||!w)throw Error('No same-origin document');
            const viewport=w.innerWidth;
            const documentWidth=d.documentElement.scrollWidth;
            const style=w.getComputedStyle(d.body);
            const h1=[...d.querySelectorAll('h1')].filter(el=>isVisible(w,el));
            const nav=d.querySelector('nav.jrs-sitenav');
            const btn=d.querySelector('.jrs-global-nav-toggle');
            const navAvailable=!nav || (!!btn && btn.getAttribute('aria-controls')===nav.id &&
              btn.getAttribute('aria-expanded')==='false');
            const controls=[...d.querySelectorAll('button,input:not([type="hidden"]),select,textarea')].filter(el=>isVisible(w,el));
            const undersized=controls.filter(el=>{
              const rect=el.getBoundingClientRect();
              return rect.height>0 && rect.height<24;
            }).slice(0,8).map(el=>({
              tag:el.tagName.toLowerCase(),id:el.id||null,
              height:Math.round(el.getBoundingClientRect().height)
            }));
            const advisoryTargetCount=controls.filter(el=>{
               const rect=el.getBoundingClientRect();
               return rect.height>0 && rect.height<44;
             }).length;
             const title=(d.title||'').trim();
            const failures=[];
            // Exercise actual card semantics and a keyboard activation against
            // source-rendered Standard and Training routes.
            let keyboardCards=0;
            let keyboardActivation=false;
            if(item.path==='jrsstandard.html'||item.path==='training.html'){
              const cards=[...d.querySelectorAll('div[onclick]')];
              keyboardCards=cards.length;
              const invalid=cards.filter(el=>el.getAttribute('role')!=='button'
                ||el.getAttribute('tabindex')!=='0'
                ||!el.hasAttribute('data-jrs-keyboard-control'));
              if(invalid.length)failures.push('keyboard-cards-unbound-'+invalid.length);
              const accordions=cards.filter(el=>el.classList.contains('worksheet-header')
                ||el.classList.contains('maturity-level-header'));
              if(accordions.some(el=>!el.getAttribute('aria-controls')
                ||el.getAttribute('aria-expanded')===null))failures.push('accordion-aria-state');
              const card=cards.find(el=>isVisible(w,el));
              if(card&&!invalid.length){
                let activated=0;
                card.addEventListener('click',()=>activated++,{once:true});
                card.focus();
                card.dispatchEvent(new w.KeyboardEvent('keydown',{
                  key:'Enter',bubbles:true,cancelable:true
                }));
                keyboardActivation=activated===1;
                if(!keyboardActivation)failures.push('keyboard-activation');
              }else if(!card)failures.push('no-focusable-action-card');
            }
            if(!d.doctype || d.doctype.name.toLowerCase()!=='html')failures.push('doctype');
            if((d.documentElement.lang||'').toLowerCase()!=='en')failures.push('language');
            if(!d.querySelector('meta[name="viewport"]'))failures.push('viewport-meta');
            if(!d.body.classList.contains('jrs-institutional'))failures.push('institutional-theme');
            if(!style.fontFamily.includes('Inter'))failures.push('body-font');
            if(![ 'rgb(245, 247, 248)', 'rgb(245,247,248)' ].includes(style.backgroundColor))failures.push('page-background');
            if(h1.length<1)failures.push('visible-h1');
            if(documentWidth>viewport+1)failures.push('horizontal-overflow');
            if(!navAvailable)failures.push('mobile-navigation-semantics');
            if(!title)failures.push('document-title');
            finish({...item,pass:failures.length===0,failures,
              documentWidth,viewport,visibleHeadings:h1.length,
              controlCount:controls.length,keyboardCards,keyboardActivation,undersizedControls:undersized,
               advisoryUnder44px:advisoryTargetCount,
              bodyFont:style.fontFamily,background:style.backgroundColor,
              title:title.slice(0,84)});
          }catch(e){finish({...item,pass:false,error:String(e)});}
        })();
      },{once:true});
      f.src='/'+item.path;
      document.body.appendChild(f);
    });
  }
  // Four isolated browsers per batch avoids serial delays and excessive memory.
  for(let start=0;start<jobs.length;start+=4){
    await Promise.all(jobs.slice(start,start+4).map((item,i)=>check(item,start+i)));
  }
  document.getElementById('jrs-sitewide-results').textContent=
    'JRS_SITEWIDE_JSON_BEGIN'+JSON.stringify(records)+'JRS_SITEWIDE_JSON_END';
  document.body.dataset.auditComplete='true';
})();
</script>
</body></html>
