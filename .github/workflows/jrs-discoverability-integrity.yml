name: JRS Discoverability Integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'robots.txt'
      - 'sitemap.xml'
      - 'jrsstandard.html'
      - 'llms.txt'
      - 'jrs-sources.json'
      - 'tests/jrs-discoverability-contract.test.mjs'
      - 'vercel.json'
      - 'reviewer/index.html'
      - '.github/workflows/jrs-discoverability-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'robots.txt'
      - 'sitemap.xml'
      - 'jrsstandard.html'
      - 'llms.txt'
      - 'jrs-sources.json'
      - 'tests/jrs-discoverability-contract.test.mjs'
      - 'vercel.json'
      - 'reviewer/index.html'
      - '.github/workflows/jrs-discoverability-integrity.yml'
permissions:
  contents: read
jobs:
  discoverability-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify crawl and source-citation contracts
        run: node --test tests/jrs-discoverability-contract.test.mjs
