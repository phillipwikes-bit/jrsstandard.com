name: IncomeOS mobile viewport and staging browser audit
on:
  pull_request:
    paths:
      - 'owner/incomeos/**'
      - 'tests/incomeos-browser-audit.html'
      - 'tests/incomeos-browser-audit-check.py'
      - 'tests/incomeos-project-ui-browser.mjs'
      - '.github/workflows/incomeos-mobile-browser-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-rendered-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify installed Chromium-compatible browser
        run: |
          for cmd in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "INCOMEOS_BROWSER=$(command -v "$cmd")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "A headless Chrome installation is required" >&2
          exit 1
      - name: Run same-origin static site for test only
        run: |
          nohup python3 -m http.server 8793 --bind 127.0.0.1 > /tmp/incomeos-mobile-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsSI http://127.0.0.1:8793/owner/incomeos/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Local IncomeOS source server could not start" >&2
          exit 1
      - name: Verify layout, navigation, source feed and financial staging hold
        run: |
          "$INCOMEOS_BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=28000 --window-size=1440,1000 \
            --dump-dom http://127.0.0.1:8793/tests/incomeos-browser-audit.html \
            > /tmp/incomeos-mobile-audit-dom.html 2>/tmp/incomeos-mobile-chrome-errors.log
          python3 tests/incomeos-browser-audit-check.py /tmp/incomeos-mobile-audit-dom.html
      - name: Install pinned Playwright driver (no install scripts, no lockfile)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.63.0
      - name: Verify owner panels at iPhone width (screening, This week, actions, encrypted save)
        env:
          CI: "true"
        run: node tests/incomeos-project-ui-browser.mjs
