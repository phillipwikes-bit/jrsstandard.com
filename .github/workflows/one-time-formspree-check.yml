name: One-time check existing JRS Formspree delivery
on:
  push:
    branches: ['fix/jrs-contact-existing-formspree-2026-11-01']
    paths: ['.github/workflows/one-time-formspree-check.yml']
permissions:
  contents: read
jobs:
  test-existing-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit clearly labeled synthetic test to historical JRS form
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 8 --max-time 20 --retry 0 \
            --output /tmp/form-response --write-out '%{http_code}' \
            --request POST 'https://formspree.io/f/mreddwdg' \
            --header 'Accept: application/json' \
            --header 'Origin: https://www.jrsstandard.com' \
            --data-urlencode 'name=JRS SYSTEM TEST' \
            --data-urlencode 'email=phillipwikes@gmail.com' \
            --data-urlencode '_subject=JRS_FORM_SMOKE_20261101_HF7Q8' \
            --data-urlencode 'source=system-test-general-contact' \
            --data-urlencode 'consent=owner_approved_synthetic_test' \
            --data-urlencode 'message=JRS_FORM_SMOKE_20261101_HF7Q8. This is a synthetic website contact delivery test initiated by the JRS owner; no real visitor, no decision record, no need to reply.')"
          echo "Formspree HTTP status: $code"
          if [[ "$code" =~ ^2[0-9]{2}$ ]]; then
             echo "Provider accepted test submission. Mailbox arrival must be checked separately."
          else
             echo "Provider did not accept test submission. Only HTTP status is recorded."
             exit 1
          fi
