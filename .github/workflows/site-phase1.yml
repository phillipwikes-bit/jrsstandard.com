name: JRS public site standard-first phase 1 checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'enterprise.html'
      - 'resources.html'
      - 'research.html'
      - 'contact.html'
      - 'about.html'
      - 'review-engine.html'
      - 'manifest.html'
      - 'decision-reconstruction-risk.html'
      - 'codebook.html'
      - 'investigator-guides.html'
      - 'engagement.html'
      - 'terms.html'
      - 'simulations.html'
      - 'implementation-scenarios.html'
      - 'api/site-inquiry.js'
      - 'api/site-inquiry-config.js'
      - 'api/leads-4b7e2c9af106d385.js'
      - 'api/people-9dd1ecdf6f8cdfd4.js'
      - 'vercel.json'
      - 'tests/site-inquiry.mjs'
      - 'tests/site-phase1.mjs'
      - '.github/workflows/site-phase1.yml'
  push:
    paths:
      - 'index.html'
      - 'enterprise.html'
      - 'resources.html'
      - 'research.html'
      - 'contact.html'
      - 'about.html'
      - 'review-engine.html'
      - 'manifest.html'
      - 'decision-reconstruction-risk.html'
      - 'codebook.html'
      - 'investigator-guides.html'
      - 'engagement.html'
      - 'terms.html'
      - 'simulations.html'
      - 'implementation-scenarios.html'
      - 'api/site-inquiry.js'
      - 'api/site-inquiry-config.js'
      - 'api/leads-4b7e2c9af106d385.js'
      - 'api/people-9dd1ecdf6f8cdfd4.js'
      - 'vercel.json'
      - 'tests/site-inquiry.mjs'
      - 'tests/site-phase1.mjs'
      - '.github/workflows/site-phase1.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-inquiry.mjs
      - run: node tests/site-phase1.mjs
      - run: node tests/public-route-alignment.mjs
