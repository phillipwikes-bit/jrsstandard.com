permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node tests/owner-router.mjs
      - run: node tests/notify-gmail-readiness.mjs
      - run: node tests/route-access-inventory.mjs
      - run: node tests/private-research-readers.mjs
      - run: node tests/private-programme-metrics.mjs
