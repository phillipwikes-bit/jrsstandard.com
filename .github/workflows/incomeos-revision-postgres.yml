name: IncomeOS disposable revision database verification
on:
  pull_request:
    paths:
      - 'engineering/incomeos/workspace-revision-staging.sql'
      - 'engineering/incomeos/workspace-revision-rpc-staging.sql'
      - 'tests/incomeos-revision-rpc-db.sql'
      - 'tests/incomeos-revision-rpc-concurrency.sh'
      # Any change to the staged client or its recovery tests must recheck
      # the server-side atomic append contract in disposable PostgreSQL.
      - 'owner/incomeos/revision-*.js'
      - 'owner/incomeos/workspace-revision-protocol.js'
      - 'tests/incomeos-revision-*.test.cjs'
      - '.github/workflows/incomeos-revision-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revision-db:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: incomeos-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Test staging revision RPC against isolated PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: incomeos-ci-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/incomeos-revision-rpc-db.sql
          bash tests/incomeos-revision-rpc-concurrency.sh
