name: IncomeOS private prototype checks
on:
  pull_request:
    paths:
      - 'owner/incomeos/**'
      - 'tests/incomeos-owner-prototype.mjs'
      - 'tests/incomeos-controls.mjs'
      - 'tests/incomeos-intelligence.mjs'
      - 'tests/incomeos-accounting-controls.mjs'
      - 'tests/incomeos-recovery.mjs'
      - 'tests/incomeos-event-journal.mjs'
      - 'tests/incomeos-research-outcomes.mjs'
      - 'tests/incomeos-source-boundary.mjs'
      - '.github/workflows/incomeos-private-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source integrity and public-surface isolation
        run: node tests/incomeos-owner-prototype.mjs && node tests/incomeos-controls.mjs && node tests/incomeos-intelligence.mjs && node tests/incomeos-accounting-controls.mjs && node tests/incomeos-recovery.mjs && node tests/incomeos-event-journal.mjs && node tests/incomeos-research-outcomes.mjs && node tests/incomeos-source-boundary.mjs
