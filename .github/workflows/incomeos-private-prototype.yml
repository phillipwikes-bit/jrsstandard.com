name: IncomeOS private prototype checks
on:
  pull_request:
    paths:
      - 'owner/incomeos/**'
      - 'tests/incomeos-owner-prototype.mjs'
      - 'tests/incomeos-controls.mjs'
      - 'tests/incomeos-intelligence.mjs'
      - 'tests/incomeos-spend-recovery-review.mjs'
      - 'tests/incomeos-journal-statement-review.mjs'
      - 'tests/incomeos-ds-program.mjs'
      - 'tests/incomeos-accounting-controls.mjs'
      - 'tests/incomeos-recovery.mjs'
      - 'tests/incomeos-event-journal.mjs'
      - 'tests/incomeos-research-outcomes.mjs'
      - '.vercelignore'
      - 'tests/incomeos-source-boundary.mjs'
      - 'tests/incomeos-feed-adapter.mjs'
      - 'tests/incomeos-financial-value.mjs'
      - 'tests/incomeos-statement-close.mjs'
      - 'tests/incomeos-private-append.mjs'
      - 'tests/incomeos-capital-readiness.mjs'
      - 'tests/incomeos-investment-cashflow.mjs'
      - 'tests/incomeos-transfer-reconciliation.mjs'
      - 'tests/incomeos-preview-probe.mjs'
      - 'tests/incomeos-preview-probe-qa.mjs'
      - 'tests/incomeos-accountant-persistence.mjs'
      - 'tests/incomeos-staging-privacy.mjs'
      - 'tests/incomeos-double-entry.mjs'
      - 'tests/incomeos-monthly-close.mjs'
      - 'tests/incomeos-period-rollforward.mjs'
      - 'tests/incomeos-active-vault.mjs'
      - 'tests/incomeos-encrypted-accountant-bridge.mjs'
      - 'tests/incomeos-accountant-review.mjs'
      - 'tests/incomeos-source-health.mjs'
      - 'tests/incomeos-source-health-ui.mjs'
      - 'tests/incomeos-source-attestation.mjs'
      - 'tests/incomeos-economic-outcomes.mjs'
      - 'tests/incomeos-outcome-reconciliation.mjs'
      - 'tests/incomeos-release-gate.mjs'
      - 'tests/incomeos-project-radar.mjs'
      - 'tests/incomeos-iphone-install.mjs'
      - 'tests/incomeos-opportunity-intelligence.mjs'
      - 'tests/incomeos-owner-profile.mjs'
      - 'tests/incomeos-plan-features.mjs'
      - 'tests/incomeos-workspace-store.mjs'
      - 'tests/incomeos-profile-editor.mjs'
      - 'tests/incomeos-engagement.mjs'
      - 'tests/incomeos-research-ehy.mjs'
      - 'tests/incomeos-profile-store.mjs'
      - 'scripts/incomeos/**'
      - '.github/workflows/incomeos-private-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels superseded runs; the latest commit is
# always verified in full, so final verification is never skipped.
concurrency:
  group: incomeos-private-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  private-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source integrity and public-surface isolation
        run: node tests/incomeos-owner-prototype.mjs && node tests/incomeos-controls.mjs && node tests/incomeos-intelligence.mjs && node tests/incomeos-spend-recovery-review.mjs && node tests/incomeos-journal-statement-review.mjs && node tests/incomeos-ds-program.mjs && node tests/incomeos-accounting-controls.mjs && node tests/incomeos-recovery.mjs && node tests/incomeos-event-journal.mjs && node tests/incomeos-research-outcomes.mjs && node tests/incomeos-source-boundary.mjs && node tests/incomeos-feed-adapter.mjs && node tests/incomeos-financial-value.mjs && node tests/incomeos-statement-close.mjs && node tests/incomeos-private-append.mjs && node tests/incomeos-capital-readiness.mjs && node tests/incomeos-investment-cashflow.mjs && node tests/incomeos-transfer-reconciliation.mjs && node tests/incomeos-preview-probe-qa.mjs && node tests/incomeos-accountant-persistence.mjs && node tests/incomeos-staging-privacy.mjs && node tests/incomeos-double-entry.mjs && node tests/incomeos-monthly-close.mjs && node tests/incomeos-period-rollforward.mjs && node tests/incomeos-active-vault.mjs && node tests/incomeos-encrypted-accountant-bridge.mjs && node tests/incomeos-accountant-review.mjs && node tests/incomeos-source-health.mjs && node tests/incomeos-source-health-ui.mjs && node tests/incomeos-source-attestation.mjs && node tests/incomeos-economic-outcomes.mjs && node tests/incomeos-outcome-reconciliation.mjs && node tests/incomeos-release-gate.mjs && node tests/incomeos-project-radar.mjs && node tests/incomeos-iphone-install.mjs && node tests/incomeos-opportunity-intelligence.mjs && node tests/incomeos-owner-profile.mjs && node tests/incomeos-plan-features.mjs && node tests/incomeos-workspace-store.mjs && node tests/incomeos-profile-editor.mjs && node tests/incomeos-engagement.mjs && node tests/incomeos-research-ehy.mjs && node tests/incomeos-profile-store.mjs
