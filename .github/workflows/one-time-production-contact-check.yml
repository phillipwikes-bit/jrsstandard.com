name: One-time live JRS public contact relay smoke
on:
  push:
    branches: ['fix/jrs-contact-existing-formspree-2026-11-01']
    paths: ['.github/workflows/one-time-production-contact-check.yml']
permissions:
  contents: read
jobs:
  public-contact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Synthetic public contact POST, no participant data
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 8 --max-time 25 --retry 0 \
            --output /tmp/contact-result --write-out '%{http_code}' \
            --request POST 'https://www.jrsstandard.com/api/site-inquiry' \
            --header 'Origin: https://www.jrsstandard.com' \
            --header 'Content-Type: application/json' \
            --data '{"name":"JRS SYSTEM TEST","email":"phillipwikes@gmail.com","organization":"Synthetic test","category":"general","message":"JRS_PROD_CONTACT_SMOKE_20261101_KT83P. Synthetic public site relay test authorized by owner. Do not reply; no participant or confidential information.","consent":true}')"
          echo "Production HTTP status: $code"
          if [[ "$code" != "200" ]] || ! grep -q '"accepted":true' /tmp/contact-result; then
            echo "::error::Live JRS contact route did not return a provider-accepted receipt."
            exit 1
          fi
          echo "Production accepted synthetic contact. Check owner's Gmail for matching reference separately."
