name: Verify production matches main

# WHY THIS EXISTS.
# On 13 September 2026 PR #28 merged, GitHub reported everything green, and the
# production build never ran. Twenty minutes later check.html was still serving
# the pre-merge 33,801 bytes against 39,437 on main, and compliance.html, a new
# route, returned 404. Every conventional signal passed the whole time: the
# apex, check.html and the sitemap all returned 200.
#
# The failure was SILENT. Nothing went red, so nothing told anyone. This job
# exists to remove that property: after every push to main it compares the
# bytes production actually serves against the commit, and turns a skipped
# deployment into a failed check.
#
# It does not revert. Production stays healthy and self-consistent on the
# previous build during a skip, so there is nothing to roll back and a revert
# would change nothing. The remedy is to re-trigger, which this job does
# automatically when a deploy hook is configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for the deployment to propagate
        run: sleep 90

      - name: Byte-compare production against this commit
        id: check
        run: |
          set +e
          python3 scripts/preflight_deploy_check.py --ref HEAD --all
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Issue 3.6: verification is read-only. A mismatch never creates a new deployment.
      # Legacy byte-parity may misclassify redirect source paths; retain failures as
      # investigatory findings until source-aware route adjudication is accepted.
      - name: Record failure without automatically deploying
        if: steps.check.outputs.rc != '0'
        run: |
          echo "::error::Production static comparison was not accepted."
          echo "::error::Review exact deployment SHA, redirects and final assets."
          echo "::error::This monitoring job deliberately does not call deploy hooks."
          exit 1
