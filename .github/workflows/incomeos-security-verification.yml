name: IncomeOS isolated security verification
on:
  pull_request:
    paths:
      - 'owner/incomeos/vault-cloud.js'
      - 'owner/incomeos/workspace-revision-protocol.js'
      - 'owner/incomeos/revision-store.js'
      - 'owner/incomeos/revision-supabase-transport.js'
      - 'engineering/incomeos/workspace-revision-staging.sql'
      - 'engineering/incomeos/workspace-revision-rpc-staging.sql'
      - 'tests/incomeos-revision-staging-sql.test.cjs'
      - 'tests/incomeos-browser-script-loader.cjs'
      - 'tests/incomeos-vault-envelope.test.cjs'
      - 'tests/incomeos-workspace-revision-protocol.test.cjs'
      - 'tests/incomeos-revision-store.test.cjs'
      - 'tests/incomeos-revision-supabase-transport.test.cjs'
      - 'tests/incomeos-revision-rpc-integration.test.cjs'
      - 'owner/incomeos/revision-workspace-bridge.js'
      - 'owner/incomeos/revision-runtime-staging.js'
      - 'tests/incomeos-revision-workspace-bridge.test.cjs'
      - 'owner/incomeos/revision-accounting-coordinator.js'
      - 'owner/incomeos/workspace-store.js'
      - 'owner/incomeos/accountant.js'
      - 'tests/incomeos-revision-accounting-coordinator.test.cjs'
      - 'tests/incomeos-revision-release-gate.test.cjs'
      - 'tests/incomeos-vault-revision-session.test.cjs'
      - 'owner/incomeos/ACCOUNTING-EDITOR-ACCEPTANCE.json'
      - '.github/workflows/incomeos-security-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4 tag commit
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check owner/incomeos/vault-cloud.js
          node --check owner/incomeos/workspace-revision-protocol.js
          node --check owner/incomeos/revision-store.js
          node --check owner/incomeos/revision-supabase-transport.js
          node --check owner/incomeos/revision-workspace-bridge.js
          node --check owner/incomeos/revision-runtime-staging.js
          node --check owner/incomeos/revision-accounting-coordinator.js
          node --check owner/incomeos/workspace-store.js
          node --check tests/incomeos-browser-script-loader.cjs
      - name: Synthetic regression tests
        run: |
          node tests/incomeos-vault-envelope.test.cjs
          node tests/incomeos-workspace-revision-protocol.test.cjs
          node tests/incomeos-revision-store.test.cjs
          node tests/incomeos-revision-supabase-transport.test.cjs
          node tests/incomeos-revision-rpc-integration.test.cjs
          node tests/incomeos-revision-workspace-bridge.test.cjs
          node tests/incomeos-revision-accounting-coordinator.test.cjs
          node tests/incomeos-revision-release-gate.test.cjs
          node tests/incomeos-vault-revision-session.test.cjs
          node tests/incomeos-revision-staging-sql.test.cjs
