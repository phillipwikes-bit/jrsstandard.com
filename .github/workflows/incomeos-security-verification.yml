name: IncomeOS isolated security verification
on:
  pull_request:
    paths:
      - 'owner/incomeos/vault-cloud.js'
      - 'owner/incomeos/workspace-revision-protocol.js'
      - 'owner/incomeos/revision-store.js'
      - 'owner/incomeos/revision-supabase-transport.js'
      - 'engineering/incomeos/workspace-revision-staging.sql'
      - 'engineering/incomeos/workspace-revision-rpc-staging.sql'
      - 'tests/incomeos-revision-staging-sql.test.cjs'
      - 'tests/incomeos-browser-script-loader.cjs'
      - 'tests/incomeos-vault-envelope.test.cjs'
      - 'tests/incomeos-workspace-revision-protocol.test.cjs'
      - 'tests/incomeos-revision-store.test.cjs'
      - 'tests/incomeos-revision-supabase-transport.test.cjs'
      - '.github/workflows/incomeos-security-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check owner/incomeos/vault-cloud.js
          node --check owner/incomeos/workspace-revision-protocol.js
          node --check owner/incomeos/revision-store.js
          node --check owner/incomeos/revision-supabase-transport.js
          node --check tests/incomeos-browser-script-loader.cjs
      - name: Synthetic regression tests
        run: |
          node tests/incomeos-vault-envelope.test.cjs
          node tests/incomeos-workspace-revision-protocol.test.cjs
          node tests/incomeos-revision-store.test.cjs
          node tests/incomeos-revision-supabase-transport.test.cjs
          node tests/incomeos-revision-staging-sql.test.cjs
