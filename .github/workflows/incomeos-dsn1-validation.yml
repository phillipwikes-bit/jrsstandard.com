name: IncomeOS DS-N1 development validation
on:
  push:
    branches:
      - chatgpt/incomeos-v25-synthetic-review-sequence-20261106
    paths:
      - '.github/workflows/incomeos-dsn1-validation.yml'
      - 'owner/incomeos/**'
      - 'lib/ds-n1/**'
      - 'tests/incomeos-ds-*.mjs'
      - 'tests/ds-n1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run DS-N1 runtime bridge and local security boundary tests
        run: node --test tests/incomeos-ds-runtime-bridge.mjs tests/incomeos-ds-local-server-boundary.mjs tests/incomeos-ds-evidence-export.mjs
