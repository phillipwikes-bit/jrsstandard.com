name: Public interest and private dashboard continuity
on:
  push:
    branches:
      - feat/jrs-drr-public-initiatives-2026-10-31
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve 24 existing collection and owner-report sources
        run: node tests/check-public-program-continuity.mjs
      - name: Verify accessible free initiative links and old campaign routes
        run: node tests/check-public-initiative-pages.mjs
      - name: Verify initiative support acknowledges database write failures
        run: node --test tests/initiative-support.test.mjs
      - name: Verify owner historical aggregate snapshots fail closed and reconcile
        run: node --test tests/snapshot-public-program-counts.test.mjs
      - name: Verify support-statistics failures do not report false zeros
        run: node --test tests/support-stats-completeness.test.mjs
      - name: Test owner login, cookie expiry, rotation and explicitly documented logout replay limitation
        run: node --test tests/owner-session-lifecycle.test.mjs
      - name: Reject legacy support false success and preview contamination
        run: node --test tests/legacy-support-write-ack.test.mjs
      - name: Verify owner login distinguishes unavailable server from rejected password
        run: node --test tests/owner-login-readiness.test.mjs
      - name: Reject registry consent expansion, cross-origin PII writes and false acknowledgements
        run: node --test tests/support-registry-consent-integrity.test.mjs
      - name: Verify integrated release evidence cannot convert fixtures into production or transfer approval
        run: |
          node --test tests/integrated-release-evidence.test.mjs
          node tools/check-integrated-release-evidence.mjs docs/program-status/INCREMENT_11_OBSERVED_EVIDENCE_SNAPSHOT_2026-10-31.json > /tmp/jrs-increment11-preflight.json
      - name: Verify original-source candidate custody admission with fabricated archives only
        run: python3 -m unittest discover -s tests -p 'test_original_source_candidate_intake.py' -v
      - name: Verify governing source boundary, distinct product lineages and unresolved release claims
        run: |
          node --test tests/source-claim-boundaries.test.mjs
          node tools/check-source-claim-boundaries.mjs docs/source-custody/INCREMENT_14_EVIDENCE_SCOPE_SNAPSHOT_2026-10-31.json > /tmp/jrs-source-claim-preflight.json
      - name: Reject owner-preview token-scope and exact-SHA false readiness
        run: |
          node --test tests/owner-preview-admission.test.mjs
          node tools/check-owner-preview-admission.mjs docs/program-status/INCREMENT_15_OWNER_PREVIEW_OBSERVATIONS_2026-10-31.json > /tmp/jrs-owner-preview-preflight.json
