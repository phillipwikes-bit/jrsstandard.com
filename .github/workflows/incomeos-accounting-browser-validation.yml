name: IncomeOS accounting and DS-N1 browser validation
on:
  push:
    branches:
      - chatgpt/incomeos-v25-synthetic-review-sequence-20261106
    paths:
      - '.github/workflows/incomeos-accounting-browser-validation.yml'
      - 'owner/incomeos/**'
      - 'tests/incomeos-accounting-editor-browser.mjs'
      - 'tests/incomeos-accounting-backup-browser.mjs'
      - 'tests/incomeos-vault-cloud-browser.mjs'
      - 'lib/ds-n1/**'
      - 'tests/ds-n1/author.browser.mjs'
  pull_request:
    branches:
      - chatgpt/incomeos-vault-envelope-validation-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-iphone-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.56.1 playwright@1.56.1
      - name: Cache Playwright browser binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-linux-1.56.1
      - name: Install Chromium for browser validation
        timeout-minutes: 7
        run: |
          # Avoid apt font downloads: the hosted runner already includes Chromium system libraries.
          # Network-bound install-deps previously timed out before any browser test executed.
          timeout --signal=TERM --kill-after=10s 180s npx playwright-core install chromium
      - name: Verify accounting editor and encrypted vault in simulated iPhone browsers
        run: |
          timeout --signal=TERM --kill-after=10s 120s node tests/incomeos-accounting-editor-browser.mjs
          timeout --signal=TERM --kill-after=10s 120s node tests/incomeos-accounting-backup-browser.mjs
          timeout --signal=TERM --kill-after=10s 120s node tests/incomeos-vault-cloud-browser.mjs
          timeout --signal=TERM --kill-after=10s 120s node tests/ds-n1/author.browser.mjs
