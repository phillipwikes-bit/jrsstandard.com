name: IncomeOS anonymous access probe
# Runs on every IncomeOS change and manually. Fetches the IncomeOS hosted address with no credentials, as a stranger would, and fails
# if the app itself is served instead of the Vercel login. Read-only: it changes nothing and sends no data.
on:
  push:
    branches:
      - chatgpt/incomeos-v25-synthetic-review-sequence-20261106
    paths:
      - '.github/workflows/incomeos-anonymous-access-probe.yml'
      - 'owner/incomeos/**'
  pull_request:
    paths:
      - '.github/workflows/incomeos-anonymous-access-probe.yml'
      - 'owner/incomeos/**'
  workflow_dispatch:
    inputs:
      host:
        description: "Host to probe (must be an incomeos-opportunity-desk *.vercel.app address)"
        default: "incomeos-opportunity-desk.vercel.app"
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe without credentials
        env:
          HOST: ${{ inputs.host || 'incomeos-opportunity-desk.vercel.app' }}
        run: |
          set -eu
          case "$HOST" in
            incomeos-opportunity-desk.vercel.app) ;;
            incomeos-opportunity-desk-*-phillip-wikes-projects.vercel.app) ;;
            *) echo "Refusing host outside the known IncomeOS project namespace: $HOST"; exit 2 ;;
          esac
          for path in / /index.html /accountant.js /manifest.webmanifest; do
            # An HTTP error, missing challenge, or unexpected redirect is NOT
            # evidence of authentication. Do not follow redirects or send cookies.
            code=$(curl -sS --max-time 20 -o body.txt -D headers.txt -w '%{http_code}' "https://$HOST$path") || {
              echo "FAIL: anonymous probe request failed for $path"
              exit 1
            }
            loc=$(grep -i '^location:' headers.txt | head -1 | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r' || true)
            case "$code" in
              302|303|307|308) ;;
              *) echo "FAIL: $path returned HTTP $code, not a verifiable SSO redirect"; exit 1 ;;
            esac
            case "$loc" in
              https://vercel.com/sso-api\?*) ;;
              *) echo "FAIL: $path did not redirect to the expected Vercel SSO challenge"; exit 1 ;;
            esac
            echo "PASS: $path returned HTTP $code with the expected Vercel SSO challenge"
          done
          echo "PASS: Vercel SSO challenge observed for the four tested paths on $HOST."
          echo "LIMITATION: This does not establish owner-only team authorization or protection of a different deployment SHA."
