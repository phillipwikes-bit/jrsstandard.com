name: IncomeOS anonymous access probe
# Runs on every IncomeOS change and manually. Fetches the IncomeOS hosted address with no credentials, as a stranger would, and fails
# if the app itself is served instead of the Vercel login. Read-only: it changes nothing and sends no data.
on:
  pull_request:
    paths:
      - '.github/workflows/incomeos-anonymous-access-probe.yml'
      - 'owner/incomeos/**'
  workflow_dispatch:
    inputs:
      host:
        description: "Host to probe (must be an incomeos-opportunity-desk *.vercel.app address)"
        default: "incomeos-opportunity-desk.vercel.app"
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe without credentials
        env:
          HOST: ${{ inputs.host || 'incomeos-opportunity-desk.vercel.app' }}
        run: |
          set -u
          case "$HOST" in incomeos-opportunity-desk*.vercel.app) ;; *) echo "Refusing host outside the IncomeOS project: $HOST"; exit 2;; esac
          fail=0
          for path in / /index.html /accountant.js /manifest.webmanifest; do
            code=$(curl -sS --max-time 20 -o body.txt -D headers.txt -w '%{http_code}' "https://$HOST$path" || echo 000)
            loc=$(grep -i '^location:' headers.txt | head -1 | tr -d '\r')
            title=$(grep -o '<title>[^<]*' body.txt | head -1 | sed 's/<title>//')
            echo "PATH $path -> HTTP $code ${loc:+($loc)} title=[$title]"
            grep -i -E '^(cache-control|content-security-policy|x-robots-tag|x-frame-options):' headers.txt | sed 's/^/  /' | tr -d '\r'
            if [ "$code" = "200" ] && grep -q -E 'IncomeOS|accountant|IncomeOSAccountant' body.txt; then
              echo "  RESULT: app content served to an anonymous visitor"; fail=1
            else
              echo "  RESULT: app content not served anonymously"
            fi
          done
          if [ "$fail" = 1 ]; then echo "OWNER-ONLY ACCESS NOT ENFORCED"; exit 1; fi
          echo "OWNER-ONLY ACCESS ENFORCED FOR PROBED PATHS (anonymous visitor did not receive app content)"
