name: Verify contributor consent status interpretation

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'docs/enterprise-diligence/**'
      - 'tests/consent-status-precedence.mjs'
      - 'docs/architecture/CURRENT_ENGINE_HANDOFF_2026-10-05.md'
  push:
    paths:
      - 'CLAUDE.md'
      - 'docs/enterprise-diligence/**'
      - 'tests/consent-status-precedence.mjs'
      - 'docs/architecture/CURRENT_ENGINE_HANDOFF_2026-10-05.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify evidence and controlling consent interpretation
        run: node tests/consent-status-precedence.mjs
