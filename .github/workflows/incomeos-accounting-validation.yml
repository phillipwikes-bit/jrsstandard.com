name: IncomeOS accounting editor source validation
on:
  push:
    branches:
      - chatgpt/incomeos-v25-synthetic-review-sequence-20261106
    paths:
      - '.github/workflows/incomeos-accounting-validation.yml'
      - 'owner/incomeos/**'
      - 'tests/incomeos-accounting-*.mjs'
      - 'tests/incomeos-accountant-*.mjs'
      - 'tests/incomeos-vault-cloud.mjs'
      - 'tests/incomeos-release-gate.mjs'
      - 'tests/incomeos-decision-review-gate.mjs'
      - 'tests/incomeos-owner-feed-safety.mjs'
      - 'tests/incomeos-weekly-health.mjs'
      - 'tests/incomeos-outcome-evidence.mjs'
      - 'tests/incomeos-recovery.mjs'
      - 'tests/incomeos-active-vault.mjs'
      - 'tests/incomeos-workspace-store.mjs'
      - 'tests/incomeos-staging-privacy.mjs'
      - 'tests/incomeos-vault-review.mjs'
      - 'tests/owner-session-lifecycle.test.mjs'
      - 'tests/owner-neon-otp-failures.test.mjs'
      - 'api/_owner-auth.js'
      - 'api/owner-session.js'
      - 'api/owner-email-login.js'
      - 'api/owner-release-readiness.js'
      - 'tests/owner-release-readiness.mjs'
      - 'tests/owner-readiness-mainline.mjs'
      - 'tests/owner-access.mjs'
      - 'tests/owner-data-fail-closed.mjs'
      - 'tests/owner-logout-interface.mjs'
      - 'tests/incomeos-acceptance-record.mjs'
      - 'tests/incomeos-gate-review.mjs'
      - 'tests/incomeos-source-boundary.mjs'
  pull_request:
    branches:
      - chatgpt/incomeos-vault-envelope-validation-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate accounting controls, persistence, review and corrections
        run: node --test tests/incomeos-accounting-controls.mjs tests/incomeos-accountant-persistence.mjs tests/incomeos-accountant-overflow.mjs tests/incomeos-accountant-review.mjs tests/incomeos-accountant-fixes.mjs tests/incomeos-encrypted-accountant-bridge.mjs tests/incomeos-vault-cloud.mjs tests/incomeos-double-entry.mjs tests/incomeos-transfer-reconciliation.mjs tests/incomeos-release-gate.mjs tests/incomeos-decision-review-gate.mjs tests/incomeos-owner-feed-safety.mjs tests/incomeos-weekly-health.mjs tests/incomeos-outcome-evidence.mjs tests/incomeos-recovery.mjs tests/incomeos-active-vault.mjs tests/incomeos-workspace-store.mjs tests/incomeos-staging-privacy.mjs tests/incomeos-vault-review.mjs tests/owner-session-lifecycle.test.mjs tests/owner-neon-otp-failures.test.mjs tests/owner-release-readiness.mjs tests/owner-readiness-mainline.mjs tests/owner-access.mjs tests/owner-data-fail-closed.mjs tests/owner-logout-interface.mjs tests/incomeos-acceptance-record.mjs tests/incomeos-gate-review.mjs tests/incomeos-source-boundary.mjs
