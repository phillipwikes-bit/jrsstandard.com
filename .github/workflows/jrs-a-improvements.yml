name: JRS A-grade practitioner routes, editions and analytics safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  practitioner-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate practitioner routes and non-sensitive events
        run: node tests/jrs-a-improvements.test.mjs
      - name: Check guide heading order and PDF structure preflight without certification claims
        run: node tests/jrs-accessibility-acceptance.test.mjs
      - name: Preserve existing homepage and resource directory contracts
        run: |
          node tests/jrs-practitioner-journey.mjs
          node tests/jrs-resource-directory.mjs
      - name: Validate responsive HTML in local Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8791 --bind 127.0.0.1 >/tmp/jrs-a-grade-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8791/editions.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [[ -z "$browser" ]]; then echo 'Chromium is unavailable; release check cannot pass'; exit 1; fi
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=60000 --window-size=1440,1200 --dump-dom http://127.0.0.1:8791/tests/jrs-a-improvements-browser.html > /tmp/jrs-a-grade-dom.txt
          python3 tests/jrs-browser-gate-check.py --self-test
          python3 tests/jrs-browser-gate-check.py /tmp/jrs-a-grade-dom.txt responsive

      - name: Scan 20 public routes across 40 mobile/desktop conditions with pinned axe-core
        shell: bash
        run: |
          set -euo pipefail
          # axe-core is used in CI only. The test and node_modules directories
          # are excluded from the published Vercel asset boundary.
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund axe-core@4.10.3
          test -s node_modules/axe-core/axe.min.js
          python3 -m http.server 8792 --bind 127.0.0.1 >/tmp/jrs-axe-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8792/editions.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --virtual-time-budget=180000 --window-size=1440,1200 --dump-dom http://127.0.0.1:8792/tests/jrs-wcag-axe-browser.html > /tmp/jrs-axe-dom.txt 2>/tmp/jrs-axe-errors.log
          python3 tests/jrs-browser-gate-check.py /tmp/jrs-axe-dom.txt axe
