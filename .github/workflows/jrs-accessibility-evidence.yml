name: JRS source accessibility evidence, not conformance certification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Document PDF tagging gaps and enforce original byte identities
        run: |
          node tests/jrs-accessibility-acceptance.test.mjs
          node tests/jrs-pdf-accessibility-inventory.mjs
      - name: Check strict browser evidence parser
        run: python3 tests/jrs-browser-gate-check.py --self-test
      - name: Test 400-percent-equivalent reflow at two narrow widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8794 --bind 127.0.0.1 >/tmp/jrs-reflow-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8794/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=180000 --window-size=1440,1200 --dump-dom http://127.0.0.1:8794/tests/jrs-400-percent-reflow-browser.html > /tmp/jrs-reflow-dom.txt 2>/tmp/jrs-reflow-errors.log
          python3 tests/jrs-browser-gate-check.py /tmp/jrs-reflow-dom.txt reflow /tmp/jrs-reflow-evidence.json
      - name: Install pinned axe-core for CI only
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund axe-core@4.10.3
          test -s node_modules/axe-core/axe.min.js
      - name: Scan 20 public routes at mobile and desktop widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8792 --bind 127.0.0.1 >/tmp/jrs-axe-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8792/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --virtual-time-budget=180000 --window-size=1440,1200 --dump-dom http://127.0.0.1:8792/tests/jrs-wcag-axe-browser.html > /tmp/jrs-axe-dom.txt 2>/tmp/jrs-axe-errors.log
          python3 tests/jrs-browser-gate-check.py /tmp/jrs-axe-dom.txt axe /tmp/jrs-axe-evidence.json
      - name: Scan seven dynamic states at mobile and desktop widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8793 --bind 127.0.0.1 >/tmp/jrs-states-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8793/resources.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --virtual-time-budget=180000 --window-size=1440,1200 --dump-dom http://127.0.0.1:8793/tests/jrs-interaction-a11y-browser.html > /tmp/jrs-states-dom.txt 2>/tmp/jrs-states-errors.log
          python3 tests/jrs-browser-gate-check.py /tmp/jrs-states-dom.txt states /tmp/jrs-states-evidence.json
      - name: Verify seven-point screen-reader announcements and click privacy in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8795 --bind 127.0.0.1 >/tmp/jrs-check-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8795/check.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=60000 --window-size=1440,1100 --dump-dom http://127.0.0.1:8795/tests/jrs-check-a11y-browser.html > /tmp/jrs-check-a11y-dom.txt 2>/tmp/jrs-check-a11y-errors.log
          python3 tests/jrs-browser-gate-check.py /tmp/jrs-check-a11y-dom.txt check /tmp/jrs-check-a11y-evidence.json
      - name: Verify printable reading aid excludes navigation and study body
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8796 --bind 127.0.0.1 >/tmp/jrs-check-print-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8796/check.html >/dev/null; then break; fi
            sleep 0.25
          done
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          if ! command -v pdftotext >/dev/null; then
            # CI-only text extraction, never added to deployed JRS assets.
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends poppler-utils
          fi
          command -v pdftotext >/dev/null || { echo 'RELEASE HOLD: PDF text checker unavailable'; exit 1; }
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 --no-pdf-header-footer \
            --print-to-pdf=/tmp/jrs-check-summary-preflight.pdf \
            http://127.0.0.1:8796/check.html >/tmp/jrs-check-print-chrome.log 2>&1
          test -s /tmp/jrs-check-summary-preflight.pdf
          pdftotext -layout /tmp/jrs-check-summary-preflight.pdf /tmp/jrs-check-print-text.txt
          grep -Fq 'Seven-Point Record Review Summary' /tmp/jrs-check-print-text.txt || \
            { echo 'RELEASE HOLD: printed summary title missing'; exit 1; }
          grep -Fq 'Tick the boxes that apply to the record' /tmp/jrs-check-print-text.txt || \
            { echo 'RELEASE HOLD: printed review state missing'; exit 1; }
          if grep -Eiq 'Site menu|Close site menu|Seven documentation-risk patterns|The five conditions behind the check|Check one record now|Take it further|Submit inquiry|Make this a policy' /tmp/jrs-check-print-text.txt; then
            echo 'RELEASE HOLD: unrelated source material leaked into review printout'
            exit 1
          fi
          export JRS_BROWSER="$browser"
          node tests/jrs-check-selected-print.mjs \
            http://127.0.0.1:8796/check.html /tmp/jrs-check-selected-preflight.pdf
          test -s /tmp/jrs-check-selected-preflight.pdf
          pdftotext -layout /tmp/jrs-check-selected-preflight.pdf /tmp/jrs-check-selected-text.txt
          for required in 'Seven-Point Record Review Summary' 'Fluent groundlessness' 'Chronology collapse' '2 checked questions warrant review' 'A larger count does not establish a diagnostic category'; do
            grep -Fq "$required" /tmp/jrs-check-selected-text.txt || \
              { echo "RELEASE HOLD: selected print missing required review content"; exit 1; }
          done
          if grep -Eiq 'Site menu|Close site menu|Seven documentation-risk patterns|Check one record now|Take it further|Make this a policy|Copy summary' /tmp/jrs-check-selected-text.txt; then
            echo 'RELEASE HOLD: selected summary print contains navigation or action controls'
            exit 1
          fi
          echo 'PASS: both empty and synthetic two-selection review printouts retain only required record-check content.'
          echo 'LIMITATION: unselected and synthetic selected browser print checks only. PDF/UA and human accessibility review remain unassessed.'
      - name: Retain inspected test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jrs-scoped-accessibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/jrs-reflow-evidence.json
            /tmp/jrs-axe-evidence.json
            /tmp/jrs-states-evidence.json
            /tmp/jrs-check-a11y-evidence.json
            /tmp/jrs-check-summary-preflight.pdf
            /tmp/jrs-check-print-text.txt
            /tmp/jrs-check-selected-preflight.pdf
            /tmp/jrs-check-selected-text.txt
          if-no-files-found: warn
          retention-days: 30
