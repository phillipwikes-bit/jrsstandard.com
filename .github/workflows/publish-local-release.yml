name: Publish verified JRS website release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-local-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified release commits
        shell: bash
        run: |
          set -euo pipefail
          unzip jrs-release.zip -d /tmp/jrs-release
          git config user.name "Phillip Wikes"
          git config user.email "173777956+phillipwikes-bit@users.noreply.github.com"
          git am /tmp/jrs-release/*.patch
          rm -f jrs-release.zip .github/workflows/publish-local-release.yml
          git add -A
          git commit -m "Remove temporary release transport"
          git push origin HEAD:main
