name: JRS consolidated campaigns evidence gate
on:
  pull_request:
    paths:
      - 'right-to-know-why.html'
      - 'decisions-you-can-defend.html'
      - 'outreach-email-builder.html'
      - 'vercel.json'
      - 'sitemap.xml'
      - 'resources.html'
      - 'privacy-notice.html'
      - 'assets/jrs-engagement.js'
      - 'assets/jrs-human-examples.css'
      - 'tests/jrs-cialdini-campaign-consolidation.test.mjs'
      - 'tests/jrs-human-examples-contract.mjs'
      - '.github/workflows/jrs-consolidated-campaigns.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaigns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify the two-campaign integration and event boundaries
        run: node --test tests/jrs-cialdini-campaign-consolidation.test.mjs
      - name: Verify five existing examples and research boundaries
        run: node tests/jrs-human-examples-contract.mjs
