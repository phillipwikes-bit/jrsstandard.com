name: IncomeOS contact privacy P0
on:
  push:
    branches:
      - chatgpt/incomeos-contact-first-vercel-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-profile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check owner/incomeos/contact-profile.js
      - run: node --test tests/incomeos-contact-profile.mjs
      - run: node tests/incomeos-source-boundary.mjs
